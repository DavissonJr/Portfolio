      <text x="28" y="42" fill="#1d2626">Quero falar com o corretor</text>
    </g>
    <g transform="translate(300 640)">
      <rect width="500" height="66" rx="20" fill="none" stroke="#e9c8a0" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="28" y="42" fill="#e9c8a0">→ conversa transferida para Rafael</text>
    </g>
  </g>
  <g font-family="monospace" font-size="15" fill="#7d8d87">
    <text x="160" y="820">webhook → fila → lock(redis) → catálogo(sql) → modelo</text>
    <text x="160" y="848">200 OK em &lt; 50 ms</text>
